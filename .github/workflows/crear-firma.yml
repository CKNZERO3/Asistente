name: Crear clave de firma (usar una sola vez)

# Genera el keystore de Iris en GitHub, sin instalar nada.
# Antes de ejecutarlo, crea UN secreto: RELEASE_KEYSTORE_PASSWORD (una contraseña larga y aleatoria).
# Después de usarlo, BORRA este archivo del repo y el artefacto que genera.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar keystore
        env:
          CLAVE: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ "${#CLAVE}" -lt 16 ]; then
            echo "::error::El secreto RELEASE_KEYSTORE_PASSWORD no existe o tiene menos de 16 caracteres."
            exit 1
          fi
          mkdir salida
          keytool -genkeypair -keystore salida/iris.jks -storetype PKCS12 \
            -alias iris -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Iris, O=Iris, C=VE" \
            -storepass "$CLAVE" -keypass "$CLAVE"
          base64 -w0 salida/iris.jks > salida/RELEASE_KEYSTORE_B64.txt
          echo "Huella SHA-1 (para Google Cloud):"
          keytool -list -v -keystore salida/iris.jks -storepass "$CLAVE" | grep -E "SHA1|SHA256"

      - name: Guardar el keystore (1 día, protegido por tu contraseña)
        uses: actions/upload-artifact@v4
        with:
          name: iris-keystore
          path: salida/
          retention-days: 1
          if-no-files-found: error
