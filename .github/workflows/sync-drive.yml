name: Sincronizar estado del repo a Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Configurar acceso a Google Drive
        env:
          RCLONE_CONF_RAW: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF_RAW" ]; then
            echo "::error::Falta el secreto RCLONE_CONF en GitHub (Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi

          mkdir -p ~/.config/rclone
          CLEAN_CONF=$(printf '%s' "$RCLONE_CONF_RAW" | tr -d '\r')

          if printf '%s' "$CLEAN_CONF" | grep -q '^[[:space:]]*{'; then
            rclone config create gdrive drive token="$CLEAN_CONF" --non-interactive >/dev/null
          else
            printf '%s\n' "$CLEAN_CONF" > ~/.config/rclone/rclone.conf
            if ! grep -q '^\[gdrive\]' ~/.config/rclone/rclone.conf && grep -q '^\[.*\]' ~/.config/rclone/rclone.conf; then
              sed -i '0,/^\[.*\]/s//\[gdrive\]/' ~/.config/rclone/rclone.conf
            fi
          fi

          if ! grep -q '^\[gdrive\]' ~/.config/rclone/rclone.conf; then
            echo "::error::El secreto RCLONE_CONF no tiene un formato válido de rclone (debe empezar por [gdrive] o ser el JSON del token)."
            exit 1
          fi

          rclone mkdir "gdrive:Iris_Repo_Mirror"

      - name: Recuperar log histórico previo de Drive (si existe)
        run: |
          mkdir -p dist-mirror
          rclone copyto "gdrive:Iris_Repo_Mirror/changelog-inteligente.md" "dist-mirror/changelog-inteligente.md" || true

      - name: Generar snapshot puro de código y log con fecha y hora
        run: node scripts/generar-snapshot.mjs

      - name: Subir y actualizar archivos en Google Drive
        run: |
          rclone copyto "dist-mirror/repo-actual.xml" "gdrive:Iris_Repo_Mirror/repo-actual.xml"
          rclone copyto "dist-mirror/changelog-inteligente.md" "gdrive:Iris_Repo_Mirror/changelog-inteligente.md"
