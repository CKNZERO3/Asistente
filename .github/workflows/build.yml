name: Build APK and Run Tests

on:
  push:
    branches:
      - main
      - "fase2-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js para validar el Worker
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar y empaquetar el Worker de Cloudflare (sin desplegar)
        working-directory: app
        run: npx --yes wrangler@4 deploy --dry-run --outdir ../.wrangler-dry-run

      - name: Preparar firma fija y número de versión
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iris.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/iris.jks" >> "$GITHUB_ENV"
            echo "Firma fija activada."
          else
            echo "::warning::No existe RELEASE_KEYSTORE_B64: se usará una clave debug temporal."
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Verificar dependencias de pruebas
        run: gradle :app:dependencies --configuration debugUnitTestCompileClasspath

      - name: Ejecutar pruebas unitarias
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Mostrar huella de la firma
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "certificate SHA-(1|256) digest" || true

      - name: Guardar APK como descarga
        uses: actions/upload-artifact@v4
        with:
          name: asistente-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
