# Memoria para el compilador de Gradle (el runner de GitHub tiene de sobra)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Usar librerías AndroidX (obligatorio hoy en día)
android.useAndroidX=true

# Estilo de código oficial de Kotlin
kotlin.code.style=official

# Cada módulo solo ve sus propios recursos (build más rápido)
android.nonTransitiveRClass=true
